<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Example Game | Pixel Arcade</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#10101b;color:#f7f4ff;font-family:system-ui,sans-serif;text-align:center;padding:24px}
    main{max-width:560px;padding:36px;border:1px solid #343047;border-radius:20px;background:#191827}
    h1{font-size:2.5rem;margin:0 0 12px}p{color:#c0bdd0;line-height:1.6}
    a,button{display:inline-block;border:0;border-radius:9px;background:#c4b5fd;color:#171323;padding:12px 18px;font-weight:700;text-decoration:none;cursor:pointer;font-size:1rem;margin:6px}
    #score{font-size:1.3rem;color:#f9a8d4}
  </style>
</head>
<body>
  <main>
    <p>PIXEL ARCADE • STARTER DEMO</p>
    <h1>Tap the star ✦</h1>
    <p>This is a tiny demo game page. Press the button to test it, then replace this page with your own HTML game.</p>
    <p id="score">Score: 0</p>
    <button id="tap">Tap for points!</button>
    <p><a href="../../index.html">← Back to all games</a></p>
  </main>
  <script>
    let score = 0;
    document.querySelector("#tap").addEventListener("click", () => {
      score++;
      document.querySelector("#score").textContent = `Score: ${score}`;
    });
  </script>
</body>
</html>
